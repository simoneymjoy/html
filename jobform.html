<body>
    <h1>Job Application Form</h1>
     <fieldset>
                <legend>
                Personal Info
                    </legend>
                    <label>Full Name:</label><br>
                     <input Type="text"><br><br>
                     <label>Email:</label><br>
                     <input type ="email"><br><br>
                     <label>Phone:</label><br>
                     <input type="number"><br>
                     <br>
                     </fieldset>
                     <br><br>
                     <fieldset>
                <legend>
                Application Details
                    </legend>
                    <label>Position Applied For:</label><br>
                    <select>
                        <option>Developer</option>

                        <option>Analyst</option><br>
                        </select><br><br>

                        <br><br>
                        <label>Upload Resume(PDF Only):</label><br>
                        <input type="file">
                        <br><br>
                        <label>Cover Letter:</label><br>
                        <textarea id="" cols="30" rows=""60 placeholder="Tell us why you're great fit..."></textarea>
                     </fieldset>
                     <br>
                         <input type="Submit Application" value="Submit Application">

         

                    


</body>
